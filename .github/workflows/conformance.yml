name: Native exact-head conformance

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [ores-otel-conformance]

permissions:
  contents: read

concurrency:
  group: native-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: browser / ${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: ores-otel/ores.otel.log
            ref: 05f14768232b770dfc2bbe03f27b388f5a701c74
            role: canonical
          - repository: ORESoftware/next-loggers.ts
            ref: 05f14768232b770dfc2bbe03f27b388f5a701c74
            role: legacy
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate shared JSON Schema and SDK API manifests
        working-directory: source
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0 referencing==0.37.0
          python scripts/validate-contracts.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run build
        working-directory: source
      - run: npm install --no-save esbuild playwright ws wrangler@3
        working-directory: source
      - run: npx playwright install --with-deps chromium
        working-directory: source
      - name: Browser conformance
        run: node tests/conformance/run-browser.mjs
        working-directory: source
      - name: workerd conformance
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --config wrangler.conformance.toml --local --port 8787 >"${RUNNER_TEMP}/workerd.log" 2>&1 &
          worker_pid=$!
          trap 'kill "${worker_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8787/; then
              break
            fi
            if ! kill -0 "${worker_pid}" 2>/dev/null; then
              cat "${RUNNER_TEMP}/workerd.log"
              exit 1
            fi
            sleep 2
          done
          body="$(curl --silent --show-error --write-out '
%{http_code}' http://127.0.0.1:8787/)"
          status="$(printf '%s' "${body}" | tail -n1)"
          printf '%s
' "${body}" | sed '$d'
          test "${status}" = "200"
      - name: Record exact source
        run: printf '%s %s %s %s
' ores-otel-log-browser-test browser "${{ matrix.role }}" "${{ matrix.ref }}"
