name: Exact-head browser observability consumer

on:
  pull_request:
    paths:
      - 'harness/observability-chain-browser.mjs'
      - '.github/workflows/observability-chain-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_LOGGERS_SHA: 1838474e85b0655080262cfa1135434f57545881
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - name: Fetch exact next-loggers source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/next-loggers.ts.git
          git -C source fetch --no-tags --depth=1 origin "$NEXT_LOGGERS_SHA"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$NEXT_LOGGERS_SHA"
          git -C source checkout --detach "$NEXT_LOGGERS_SHA"
      - name: Build exact source
        working-directory: source
        run: npm ci && npm run build
      - name: Run browser consumer contract
        env:
          NEXT_LOGGERS_SOURCE: ${{ github.workspace }}/source
        run: node --test harness/observability-chain-browser.mjs
